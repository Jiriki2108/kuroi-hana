<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" font-family="'Segoe UI', -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#16161f"/>
    </linearGradient>
    <linearGradient id="llmGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a2e"/>
      <stop offset="100%" stop-color="#1f1424"/>
    </linearGradient>
    <linearGradient id="pythonGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="unityGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2a1a"/>
      <stop offset="100%" stop-color="#142014"/>
    </linearGradient>
    <linearGradient id="memoryGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a222e"/>
      <stop offset="100%" stop-color="#141a24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b8a"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444466"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="980" fill="url(#bg)"/>

  <!-- Title -->
  <text x="640" y="48" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="600" letter-spacing="4">KUROI HANA — SYSTEM ARCHITECTURE</text>
  <text x="640" y="72" text-anchor="middle" fill="#666688" font-size="12" letter-spacing="2">LOCAL AI ASSISTANT · STREAMING TTS · VRM 3D AVATAR · AGENTIC TOOLS</text>
  <line x1="300" y1="84" x2="980" y2="84" stroke="#222233" stroke-width="1"/>

  <!-- ===== USER INPUT ===== -->
  <rect x="480" y="104" width="320" height="40" rx="20" fill="none" stroke="#ff6b8a" stroke-width="1.5" filter="url(#glow)"/>
  <text x="640" y="129" text-anchor="middle" fill="#ff6b8a" font-size="13" letter-spacing="2">USER INPUT</text>
  <text x="640" y="162" text-anchor="middle" fill="#555577" font-size="10">voice (microphone) · text (chat.html) · Unity toggle · clipboard</text>

  <!-- Arrow -->
  <line x1="640" y1="144" x2="640" y2="178" stroke="#ff6b8a" stroke-width="1.2" marker-end="url(#arrowPink)"/>

  <!-- ===== SERVER ===== -->
  <rect x="360" y="182" width="560" height="62" rx="8" fill="url(#pythonGrad)" stroke="#2a2a44" stroke-width="1"/>
  <text x="640" y="204" text-anchor="middle" fill="#8899bb" font-size="16" font-weight="600">server.py</text>
  <text x="640" y="222" text-anchor="middle" fill="#556688" font-size="11">FastAPI · WebSocket hub · broadcast relay · browser bridge</text>
  <text x="640" y="237" text-anchor="middle" fill="#444466" font-size="10">port 8001 · 22 message types (set_expression, audio_chunk, move_to, pick_up…)</text>

  <!-- Arrow -->
  <line x1="640" y1="244" x2="640" y2="278" stroke="#6666aa" stroke-width="1.2" marker-end="url(#arrowGray)"/>
  <text x="654" y="266" fill="#444466" font-size="9">IPC bridge (atomic file writes)</text>

  <!-- ===== BRAIN BOUNDARY ===== -->
  <rect x="60" y="286" width="1160" height="340" rx="10" fill="none" stroke="#2a2a44" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="640" y="308" text-anchor="middle" fill="#6677aa" font-size="14" font-weight="600" letter-spacing="3">main_chat.py — THE BRAIN LOOP</text>

  <!-- Row 1: VAD → Router → Responder → TTS → VRM -->
  <rect x="80" y="322" width="170" height="52" rx="6" fill="url(#pythonGrad)" stroke="#2a2a44" stroke-width="1"/>
  <text x="165" y="345" text-anchor="middle" fill="#aabbdd" font-size="12" font-weight="600">VAD + STT</text>
  <text x="165" y="362" text-anchor="middle" fill="#556688" font-size="10">silero-vad · Groq Whisper</text>

  <line x1="250" y1="348" x2="290" y2="348" stroke="#444466" stroke-width="1.2" marker-end="url(#arrowGray)"/>

  <rect x="295" y="322" width="170" height="52" rx="6" fill="url(#llmGrad)" stroke="#2a2a44" stroke-width="1"/>
  <text x="380" y="345" text-anchor="middle" fill="#cc99dd" font-size="12" font-weight="600">Router LLM</text>
  <text x="380" y="362" text-anchor="middle" fill="#776688" font-size="10">DeepSeek V4 Flash · temp=0</text>

  <line x1="465" y1="348" x2="505" y2="348" stroke="#444466" stroke-width="1.2" marker-end="url(#arrowGray)"/>

  <rect x="510" y="322" width="210" height="52" rx="6" fill="url(#llmGrad)" stroke="#cc99dd" stroke-width="1.5" filter="url(#glow)"/>
  <text x="615" y="345" text-anchor="middle" fill="#ddaaee" font-size="13" font-weight="600">Responder LLM</text>
  <text x="615" y="362" text-anchor="middle" fill="#9977aa" font-size="10">DeepSeek V4 Flash · 2048 tokens</text>

  <line x1="720" y1="348" x2="760" y2="348" stroke="#444466" stroke-width="1.2" marker-end="url(#arrowGray)"/>

  <rect x="765" y="322" width="185" height="52" rx="6" fill="url(#pythonGrad)" stroke="#2a2a44" stroke-width="1"/>
  <text x="857" y="345" text-anchor="middle" fill="#aabbdd" font-size="12" font-weight="600">CosyVoice3 TTS</text>
  <text x="857" y="362" text-anchor="middle" fill="#556688" font-size="10">streaming · 48+ emotions · voice clone</text>

  <line x1="950" y1="348" x2="990" y2="348" stroke="#444466" stroke-width="1.2" marker-end="url(#arrowGray)"/>

  <rect x="995" y="322" width="185" height="52" rx="6" fill="url(#pythonGrad)" stroke="#2a2a44" stroke-width="1"/>
  <text x="1087" y="345" text-anchor="middle" fill="#aabbdd" font-size="12" font-weight="600">VRM Animation</text>
  <text x="1087" y="362" text-anchor="middle" fill="#556688" font-size="10">emotion blends · gesture dispatch</text>

  <!-- Row 2: Tools (left) + Memory (right) -->
  <rect x="80" y="390" width="530" height="110" rx="6" fill="url(#pythonGrad)" stroke="#2a2a44" stroke-width="1"/>
  <text x="345" y="412" text-anchor="middle" fill="#8899bb" font-size="12" font-weight="600">12 AGENTIC TOOLS (Router-selected)</text>

  <text x="100" y="434" fill="#6677aa" font-size="10">examine_screen (Qwen2.5-VL vision)</text>
  <text x="380" y="434" fill="#6677aa" font-size="10">read_clipboard / write_clipboard</text>
  <text x="100" y="452" fill="#6677aa" font-size="10">web_search (Tavily/Serper API)</text>
  <text x="380" y="452" fill="#6677aa" font-size="10">read_project_file · append_hana_note</text>
  <text x="100" y="470" fill="#6677aa" font-size="10">query_memory (ChromaDB semantic)</text>
  <text x="380" y="470" fill="#6677aa" font-size="10">media_control · set_volume · copy_url</text>
  <text x="345" y="492" text-anchor="middle" fill="#775566" font-size="9" font-style="italic">destructive tools (edit, move, pickup, bring) gated behind Unity toggle</text>

  <rect x="625" y="390" width="570" height="110" rx="6" fill="url(#memoryGrad)" stroke="#2a2a44" stroke-width="1"/>
  <text x="910" y="412" text-anchor="middle" fill="#8899bb" font-size="12" font-weight="600">5-LAYER MEMORY SYSTEM</text>

  <text x="645" y="436" fill="#6677aa" font-size="10">ChromaDB: CORE · SEMANTIC · EPISODIC · PROCEDURAL</text>
  <text x="975" y="436" fill="#6677aa" font-size="10">FAISS IndexFlatIP (dense semantic)</text>
  <text x="645" y="454" fill="#6677aa" font-size="10">Keyword + hybrid retrieval</text>
  <text x="975" y="454" fill="#6677aa" font-size="10">Cultural context (Reddit API + RSS)</text>
  <text x="645" y="472" fill="#6677aa" font-size="10">Object permanence (spatial manifest)</text>
  <text x="975" y="472" fill="#6677aa" font-size="10">Perception history (clipboard · screen · URLs)</text>
  <text x="910" y="494" text-anchor="middle" fill="#556655" font-size="9" font-style="italic">all-MiniLM-L6-v2 embeddings · reactive identity: facts only, never behavioral directives</text>

  <!-- Row 3: Perception + Drives -->
  <rect x="80" y="514" width="530" height="58" rx="6" fill="url(#pythonGrad)" stroke="#2a2a44" stroke-width="1"/>
  <text x="345" y="532" text-anchor="middle" fill="#8899bb" font-size="12" font-weight="600">PERCEPTION ENGINE</text>
  <text x="345" y="549" text-anchor="middle" fill="#556688" font-size="10">screen capture · Qwen2.5-VL vision · OCR · foreground app · browser URL (UIAutomation)</text>
  <text x="345" y="564" text-anchor="middle" fill="#556688" font-size="10">clipboard watch · WASAPI audio · idle detection</text>

  <rect x="625" y="514" width="570" height="58" rx="6" fill="url(#pythonGrad)" stroke="#2a2a44" stroke-width="1"/>
  <text x="910" y="532" text-anchor="middle" fill="#8899bb" font-size="12" font-weight="600">4-DRIVE SYSTEM + PROACTIVE SPEECH</text>
  <text x="910" y="549" text-anchor="middle" fill="#556688" font-size="10">boredom · energy · curiosity · affection → sigmoid probability · 60s background ticks</text>
  <text x="910" y="564" text-anchor="middle" fill="#556688" font-size="10">persisted to hana_state_snapshot.json</text>

  <!-- Row 4: Proactive/Janitor LLMs -->
  <rect x="250" y="580" width="780" height="36" rx="6" fill="url(#llmGrad)" stroke="#2a2a44" stroke-width="1"/>
  <text x="640" y="596" text-anchor="middle" fill="#9988aa" font-size="11">DeepSeek V4 Pro — proactive / ambient responses</text>
  <text x="640" y="610" text-anchor="middle" fill="#776688" font-size="9">Janitor LLM (DeepSeek V4 Flash) — memory classification + summarisation + web-search digestion</text>

  <!-- Arrow: Brain → Unity -->
  <line x1="640" y1="626" x2="640" y2="658" stroke="#ff6b8a" stroke-width="1.5" marker-end="url(#arrowPink)"/>
  <text x="656" y="648" fill="#ff6b8a" font-size="10">WebSocket + HTTP</text>

  <!-- ===== UNITY ===== -->
  <rect x="60" y="666" width="1160" height="130" rx="10" fill="url(#unityGrad)" stroke="#2a4422" stroke-width="1"/>
  <text x="640" y="690" text-anchor="middle" fill="#88aa77" font-size="14" font-weight="600" letter-spacing="3">UNITY — VRM 3D AVATAR RENDERER</text>

  <!-- Unity sub-boxes: 5 across, 208px each in 1120px -->
  <rect x="80" y="706" width="208" height="40" rx="5" fill="none" stroke="#334433" stroke-width="1"/>
  <text x="184" y="725" text-anchor="middle" fill="#99bb88" font-size="11" font-weight="600">WebSocketManager</text>
  <text x="184" y="739" text-anchor="middle" fill="#557755" font-size="9">22 JSON message handlers</text>

  <rect x="302" y="706" width="208" height="40" rx="5" fill="none" stroke="#334433" stroke-width="1"/>
  <text x="406" y="725" text-anchor="middle" fill="#99bb88" font-size="11" font-weight="600">AudioStreamingManager</text>
  <text x="406" y="739" text-anchor="middle" fill="#557755" font-size="9">ring buffer · 48kHz · lipsync FFT</text>

  <rect x="524" y="706" width="208" height="40" rx="5" fill="none" stroke="#334433" stroke-width="1"/>
  <text x="628" y="725" text-anchor="middle" fill="#99bb88" font-size="11" font-weight="600">HanaAnimationManager</text>
  <text x="628" y="739" text-anchor="middle" fill="#557755" font-size="9">head/eye/spine · attention bias</text>

  <rect x="746" y="706" width="208" height="40" rx="5" fill="none" stroke="#334433" stroke-width="1"/>
  <text x="850" y="725" text-anchor="middle" fill="#99bb88" font-size="11" font-weight="600">HanaExpressions</text>
  <text x="850" y="739" text-anchor="middle" fill="#557755" font-size="9">15 blendshapes · lerp + residue</text>

  <rect x="968" y="706" width="208" height="40" rx="5" fill="none" stroke="#334433" stroke-width="1"/>
  <text x="1072" y="725" text-anchor="middle" fill="#99bb88" font-size="11" font-weight="600">HanaSpatialController</text>
  <text x="1072" y="739" text-anchor="middle" fill="#557755" font-size="9">NavMesh · pickup · present</text>

  <!-- Unity footer -->
  <text x="640" y="782" text-anchor="middle" fill="#446644" font-size="10">HanaIntentAnimator (9 gesture clips) · HanaLocomotionController · HanaBodyAnimator · FootIKController · HanaSpringBones · AutoBlink · HipYAnchor</text>

  <!-- Arrow to Output -->
  <line x1="640" y1="796" x2="640" y2="830" stroke="#ff6b8a" stroke-width="1.5" marker-end="url(#arrowPink)"/>

  <!-- ===== OUTPUT ===== -->
  <rect x="420" y="836" width="440" height="44" rx="22" fill="none" stroke="#ff6b8a" stroke-width="1.5" filter="url(#glow)"/>
  <text x="640" y="863" text-anchor="middle" fill="#ff6b8a" font-size="13" letter-spacing="2">OUTPUT</text>

  <!-- Output details (2 lines, split) -->
  <text x="640" y="900" text-anchor="middle" fill="#555577" font-size="10">streaming audio · VRM expressions + gestures · spatial movement</text>
  <text x="640" y="916" text-anchor="middle" fill="#555577" font-size="10">clipboard writes · text responses · media control · tool execution results</text>

  <!-- Stats bar -->
  <rect x="60" y="940" width="1160" height="26" rx="4" fill="none" stroke="#222233" stroke-width="0.5"/>
  <text x="130" y="957" fill="#444466" font-size="9">16 C# scripts</text>
  <text x="300" y="957" fill="#444466" font-size="9">1 Animator param (State 0–4)</text>
  <text x="500" y="957" fill="#444466" font-size="9">22 WebSocket message types</text>
  <text x="720" y="957" fill="#444466" font-size="9">48+ emotion tags → VRM blendshapes</text>
  <text x="950" y="957" fill="#444466" font-size="9">~23K synthetic training examples</text>
  <text x="1160" y="957" fill="#444466" font-size="9">4,754 lines Python</text>
</svg>
